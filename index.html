<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <title>Simple Panel</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="container">
      <h2 class="title">Premiere Panel</h2>

      <button id="btn-get-sequence" class="btn">
        Ler Sequência Ativa
      </button>

      <div id="result" class="result result--hidden">
        <span class="result__label">Sequência:</span>
        <span id="sequence-name" class="result__value"></span>
      </div>

      <div id="error" class="error error--hidden">
        <span id="error-message"></span>
      </div>
    </div>

    <script src="index.js"></script>
  </body>
</html>
